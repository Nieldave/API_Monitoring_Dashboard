global:
  resolve_timeout: 1m

route:
  receiver: local-webhook
  group_by: ["alertname", "severity"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  # Default receiver: posts to the bundled echo container so notifications are
  # visible with `docker compose logs alert_receiver`.
  - name: local-webhook
    webhook_configs:
      - url: http://alert_receiver:8080/alerts
        send_resolved: true

  # --- Slack (uncomment, then add `slack-critical` to the route) -------------
  # Alertmanager does not expand env vars; mount the webhook URL as a file and
  # reference it with api_url_file (see README "Enabling Slack and Email").
  #
  # - name: slack-critical
  #   slack_configs:
  #     - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
  #       channel: "#api-alerts"
  #       send_resolved: true
  #       title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
  #       text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"

